[paths]
state_dir = /var/lib/immich-backup
log = /var/log/immich-backup.log
lock = /var/lock/immich-backup.lock
backup_mount = /mnt/immich-backup
media_mount = /mnt/immich-media
repo = /mnt/immich-backup/immich-borg
dump = /var/backups/immich/immich-database.sql
compose = /opt/immich/docker-compose.yml
env_file = /opt/immich/.env

[identity]
backup_uuid = fa7c82c9-d4a1-426f-8dcb-bfff235d8a25
media_uuid = 92709a08-3a4a-4b41-ae31-2c4557afed84
backup_fstype = ext4
backup_parent_serial = drive-scsi2
backup_parent_min_bytes = 900000000000
backup_parent_max_bytes = 1100000000000

[backup]
postgres_container = immich_postgres
database = immich
database_user = postgres
keep_daily = 7
prune = true
initial_free_gb = 360
stop_free_gb = 10
warn_gb = 50,20,10

[schedule]
backup = *-*-* 01:00:00
check = Sun *-*-* 10:00:00
label = 01:00

[status]
host = 0.0.0.0
port = 8090
ttl = 15
immich_ping = http://127.0.0.1:2283/api/server/ping
backup_service = immich-backup.service
backup_timer = immich-backup.timer
check_service = immich-backup-check.service

[notify]
command = ssh -F /root/.ssh/config -o BatchMode=yes backup-notify
email = madhusmiles.madhukar@gmail.com

[install]
app_dir = /opt/immich-backup
roles = backup, status, check, store
